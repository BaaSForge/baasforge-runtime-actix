name: Deploy

on:
  push:
    tags:
      - "v*-prod.*"
      - "v*-stage.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to deploy (e.g. v0.0.1-prod.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.event.inputs.tag) || github.ref }}
  cancel-in-progress: false

env:
  PINNED_APP_TAG: ""
  RUN_BUILD: "true"
  BUILD_WORKERS: "true"
  RUN_MIGRATE: "true"
  RUN_DEPLOY: "true"
  RUN_TESTS: "false"
  OVERRIDE_REPO_FILE_IN_CONTAINER: "false"
  DEPLOY_SECRET_VARS: >-
    ACTOR_DATABASE_URL DATABASE_URL REDIS_URL NATS_URL
    WF_REDIS_URL WF_NATS_URL WQ_REDIS_URL WQ_NATS_URL
    ACTOR_REDIS_URL ACTOR_NATS_URL OTEL_EXPORTER_OTLP_ENDPOINT

jobs:
  resolve-meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      app_env: ${{ steps.meta.outputs.app_env }}
      environment: ${{ steps.meta.outputs.environment }}
      deploy_suffix: ${{ steps.meta.outputs.deploy_suffix }}
      app_image: ${{ steps.meta.outputs.app_image }}
      services: ${{ steps.meta.outputs.services }}
      run_build: ${{ steps.flags.outputs.run_build }}
      run_migrate: ${{ steps.flags.outputs.run_migrate }}
      run_deploy: ${{ steps.flags.outputs.run_deploy }}
      run_tests: ${{ steps.flags.outputs.run_tests }}
      override_repo_file_in_container: ${{ steps.flags.outputs.override_repo_file_in_container }}
    steps:
      - name: Resolve workflow flags
        id: flags
        run: |
          echo "run_build=${RUN_BUILD}" >> "$GITHUB_OUTPUT"
          echo "run_migrate=${RUN_MIGRATE}" >> "$GITHUB_OUTPUT"
          echo "run_deploy=${RUN_DEPLOY}" >> "$GITHUB_OUTPUT"
          echo "run_tests=${RUN_TESTS}" >> "$GITHUB_OUTPUT"
          echo "override_repo_file_in_container=${OVERRIDE_REPO_FILE_IN_CONTAINER}" >> "$GITHUB_OUTPUT"

      - name: Resolve environment
        id: meta
        run: |
          if [ -n "${PINNED_APP_TAG:-}" ]; then
            TAG="$PINNED_APP_TAG"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-prod\.[0-9]+$ ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "app_env=PROD" >> "$GITHUB_OUTPUT"
            echo "deploy_suffix=prod" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-stage\.[0-9]+$ ]]; then
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "app_env=STAGE" >> "$GITHUB_OUTPUT"
            echo "deploy_suffix=stage" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG does not match a deploy pattern."
            exit 1
          fi
          IMAGE_BASE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "app_image=${IMAGE_BASE}:${TAG}" >> "$GITHUB_OUTPUT"
          BUILD_WORKERS_JSON=false
          [ "${BUILD_WORKERS:-false}" = "true" ] && BUILD_WORKERS_JSON=true
          SERVICES=$(jq -nc \
            --arg base "$IMAGE_BASE" \
            --arg tag "$TAG" \
            --argjson build_workers "$BUILD_WORKERS_JSON" \
            '[
              {
                "service": "app",
                "dockerfile": "Dockerfile",
                "image": ($base + ":" + $tag),
                "container_suffix": "",
                "expose_ports": true,
                "cargo_features": "",
                "build": true
              },
              {
                "service": "workflow-worker",
                "dockerfile": "docker/Dockerfile.workflow_worker",
                "image": ($base + "-workflow-worker:" + $tag),
                "container_suffix": "-workflow-worker",
                "expose_ports": false,
                "cargo_features": "",
                "build": $build_workers
              },
              {
                "service": "runtime-cache-listener",
                "dockerfile": "docker/Dockerfile.runtime_cache_listener",
                "image": ($base + "-runtime-cache-listener:" + $tag),
                "container_suffix": "-runtime-cache-listener",
                "expose_ports": false,
                "cargo_features": "",
                "build": $build_workers
              },
              {
                "service": "queue-worker-worker",
                "dockerfile": "docker/Dockerfile.queue_worker_worker",
                "image": ($base + "-queue-worker-worker:" + $tag),
                "container_suffix": "-queue-worker-worker",
                "expose_ports": false,
                "cargo_features": "",
                "build": $build_workers
              },
              {
                "service": "actor-worker",
                "dockerfile": "docker/Dockerfile.actor_worker",
                "image": ($base + "-actor-worker:" + $tag),
                "container_suffix": "-actor-worker",
                "expose_ports": false,
                "cargo_features": "",
                "build": $build_workers
              },
              {
                "service": "usage-ingest-worker",
                "dockerfile": "docker/Dockerfile.usage_ingest_worker",
                "image": ($base + "-usage-ingest-worker:" + $tag),
                "container_suffix": "-usage-ingest-worker",
                "expose_ports": false,
                "cargo_features": "",
                "build": $build_workers
              }
            ]')
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

  build-and-push:
    if: ${{ needs.resolve-meta.outputs.run_build == 'true' }}
    needs: resolve-meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.resolve-meta.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-meta.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: matrix.build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.image }}
          build-args: |
            APP_ENV=${{ needs.resolve-meta.outputs.app_env }}
            CARGO_FEATURES=${{ matrix.cargo_features }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ needs.resolve-meta.outputs.app_env }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ needs.resolve-meta.outputs.app_env }}

  migrate-actors:
    if: ${{ needs.resolve-meta.outputs.run_migrate == 'true' }}
    needs: [resolve-meta, build-and-push]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-meta.outputs.environment }}
    env:
      ACTOR_DATABASE_URL: ${{ secrets.ACTOR_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      NATS_URL: ${{ secrets.NATS_URL }}
      WF_REDIS_URL: ${{ secrets.WF_REDIS_URL }}
      WF_NATS_URL: ${{ secrets.WF_NATS_URL }}
      WQ_REDIS_URL: ${{ secrets.WQ_REDIS_URL }}
      WQ_NATS_URL: ${{ secrets.WQ_NATS_URL }}
      ACTOR_REDIS_URL: ${{ secrets.ACTOR_REDIS_URL }}
      ACTOR_NATS_URL: ${{ secrets.ACTOR_NATS_URL }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
    steps:
      - name: Migrate actors database
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ${{ needs.resolve-meta.outputs.app_image }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: >-
            IMAGE,GITHUB_RUN_ID,GHCR_USER,GHCR_TOKEN,DEPLOY_SECRET_VARS,
            ACTOR_DATABASE_URL,DATABASE_URL,REDIS_URL,NATS_URL,
            WF_REDIS_URL,WF_NATS_URL,WQ_REDIS_URL,WQ_NATS_URL,
            ACTOR_REDIS_URL,ACTOR_NATS_URL,OTEL_EXPORTER_OTLP_ENDPOINT
          script: |
            set -euo pipefail

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"

            REVERT_MARKER="/tmp/baal-actor-migration-${GITHUB_RUN_ID}.revert-count"
            docker_env=()
            for v in $DEPLOY_SECRET_VARS; do docker_env+=(-e "$v"); done
            docker run --rm --network host "${docker_env[@]}" "$IMAGE" sh -ec "
            $(for v in $DEPLOY_SECRET_VARS; do printf 'saved_%s=$%s\n' "$v" "$v"; done)
            set -a && . ./.env && set +a
            $(for v in $DEPLOY_SECRET_VARS; do printf 'export %s=$saved_%s\n' "$v" "$v"; done)
            count_applied() {
              diesel migration list \
                --config-file diesel-actors.toml \
                --migration-dir migrations/actors \
                --database-url \"\$ACTOR_DATABASE_URL\" | grep -c '^\[X\]' || true
            }
            before=\$(count_applied)
            diesel migration run \
              --config-file diesel-actors.toml \
              --migration-dir migrations/actors \
              --database-url \"\$ACTOR_DATABASE_URL\"
            after=\$(count_applied)
            echo \$((after - before))
            " > "$REVERT_MARKER"
            echo "Actor migrations complete ($(cat "$REVERT_MARKER") applied, marker: $REVERT_MARKER)"

  deploy:
    if: >-
      ${{
        needs.resolve-meta.outputs.run_deploy == 'true' &&
        !cancelled() &&
        (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
        (needs.migrate-actors.result == 'success' || needs.migrate-actors.result == 'skipped')
      }}
    needs: [resolve-meta, build-and-push, migrate-actors]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-meta.outputs.environment }}
    env:
      ACTOR_DATABASE_URL: ${{ secrets.ACTOR_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      NATS_URL: ${{ secrets.NATS_URL }}
      WF_REDIS_URL: ${{ secrets.WF_REDIS_URL }}
      WF_NATS_URL: ${{ secrets.WF_NATS_URL }}
      WQ_REDIS_URL: ${{ secrets.WQ_REDIS_URL }}
      WQ_NATS_URL: ${{ secrets.WQ_NATS_URL }}
      ACTOR_REDIS_URL: ${{ secrets.ACTOR_REDIS_URL }}
      ACTOR_NATS_URL: ${{ secrets.ACTOR_NATS_URL }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.resolve-meta.outputs.services) }}
    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ${{ matrix.image }}
          CONTAINER_NAME: baal-runtime${{ matrix.container_suffix }}-${{ needs.resolve-meta.outputs.deploy_suffix }}
          EXPOSE_PORTS: ${{ matrix.expose_ports }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: >-
            IMAGE,CONTAINER_NAME,EXPOSE_PORTS,GHCR_USER,GHCR_TOKEN,
            ACTOR_DATABASE_URL,DATABASE_URL,REDIS_URL,NATS_URL,
            WF_REDIS_URL,WF_NATS_URL,WQ_REDIS_URL,WQ_NATS_URL,
            ACTOR_REDIS_URL,ACTOR_NATS_URL,OTEL_EXPORTER_OTLP_ENDPOINT
          script: |
            set -euo pipefail

            if command -v systemctl >/dev/null 2>&1; then
              systemctl enable docker
              systemctl start docker
            fi

            if docker info 2>/dev/null | grep -qi rootless; then
              if ! loginctl show-user "$(id -un)" -p Linger 2>/dev/null | grep -q "Linger=yes"; then
                echo "Rootless Docker needs linger enabled or containers stop when SSH ends."
                echo "Run: sudo loginctl enable-linger $(id -un)"
                exit 1
              fi
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"
            docker stop "$CONTAINER_NAME" 2>/dev/null || true
            docker rm "$CONTAINER_NAME" 2>/dev/null || true

            RUN_ARGS=(
              -d
              --name "$CONTAINER_NAME"
              --restart unless-stopped
              -e "ACTOR_DATABASE_URL=$ACTOR_DATABASE_URL"
              -e "DATABASE_URL=$DATABASE_URL"
              -e "REDIS_URL=$REDIS_URL"
              -e "NATS_URL=$NATS_URL"
              -e "WF_REDIS_URL=$WF_REDIS_URL"
              -e "WF_NATS_URL=$WF_NATS_URL"
              -e "WQ_REDIS_URL=$WQ_REDIS_URL"
              -e "WQ_NATS_URL=$WQ_NATS_URL"
              -e "ACTOR_REDIS_URL=$ACTOR_REDIS_URL"
              -e "ACTOR_NATS_URL=$ACTOR_NATS_URL"
              -e "OTEL_EXPORTER_OTLP_ENDPOINT=$OTEL_EXPORTER_OTLP_ENDPOINT"
            )

            if [ "$EXPOSE_PORTS" = "true" ]; then
              RUN_ARGS+=(-p 1501:1501)
            fi

            docker run "${RUN_ARGS[@]}" "$IMAGE"
            docker update --restart unless-stopped "$CONTAINER_NAME"

            RESTART_POLICY=$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' "$CONTAINER_NAME")
            if [ "$RESTART_POLICY" != "unless-stopped" ]; then
              echo "Restart policy not applied (got: $RESTART_POLICY)"
              exit 1
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME")" != "true" ]; then
              echo "Container failed to start"
              docker logs "$CONTAINER_NAME" 2>&1 | tail -50
              exit 1
            fi

            echo "Running $CONTAINER_NAME with restart policy: $RESTART_POLICY"

  integration-tests:
    name: ${{ matrix.suite }}
    needs: [resolve-meta, build-and-push, migrate-actors, deploy]
    if: >-
      ${{
        needs.resolve-meta.outputs.run_tests == 'true' &&
        !cancelled() &&
        (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
        (needs.migrate-actors.result == 'success' || needs.migrate-actors.result == 'skipped') &&
        (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-meta.outputs.environment }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - suite: common-tests
            test_script: ./units/common/test.sh
            repo_file_path: units/common/index.ts
            ssh_timeout: 15m
          - suite: actor-tests
            test_script: ./units/actor-tests/test.sh
            repo_file_path: units/actor-tests/index.ts
            ssh_timeout: 45m
          - suite: workflow-tests
            test_script: ./units/workflow-tests/test.sh
            repo_file_path: units/workflow-tests/index.ts
            ssh_timeout: 20m
          - suite: queue-worker-tests
            test_script: ./units/queue-worker-tests/test.sh
            repo_file_path: units/queue-worker-tests/index.ts
            ssh_timeout: 15m
          - suite: api-tests
            test_script: ./units/api-tests/test.sh
            repo_file_path: units/api-tests/index.ts
            ssh_timeout: 15m
          - suite: runtime-check-tests
            test_script: ./units/runtime-check/test.sh
            repo_file_path: units/runtime-check/index.ts
            ssh_timeout: 10m
    env:
      ACTOR_DATABASE_URL: ${{ secrets.ACTOR_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      NATS_URL: ${{ secrets.NATS_URL }}
      WF_REDIS_URL: ${{ secrets.WF_REDIS_URL }}
      WF_NATS_URL: ${{ secrets.WF_NATS_URL }}
      WQ_REDIS_URL: ${{ secrets.WQ_REDIS_URL }}
      WQ_NATS_URL: ${{ secrets.WQ_NATS_URL }}
      ACTOR_REDIS_URL: ${{ secrets.ACTOR_REDIS_URL }}
      ACTOR_NATS_URL: ${{ secrets.ACTOR_NATS_URL }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
    steps:
      - name: Checkout repo for file override
        if: ${{ needs.resolve-meta.outputs.override_repo_file_in_container == 'true' }}
        uses: actions/checkout@v4

      - name: Copy repo file override to test host
        id: repo_file_override
        if: ${{ needs.resolve-meta.outputs.override_repo_file_in_container == 'true' }}
        uses: ./.github/actions/copy-repo-file-override
        with:
          repo_file_path: ${{ matrix.repo_file_path }}
          run_id: ${{ github.run_id }}
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          ssh_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run integration test suite
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ${{ needs.resolve-meta.outputs.app_image }}
          TEST_SCRIPT: ${{ matrix.test_script }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERRIDE_REPO_FILE_IN_CONTAINER: ${{ needs.resolve-meta.outputs.override_repo_file_in_container }}
          OVERRIDE_HOST_FILE_PATH: ${{ steps.repo_file_override.outputs.host_file_path }}
          OVERRIDE_CONTAINER_FILE_PATH: ${{ steps.repo_file_override.outputs.container_file_path }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: ${{ matrix.ssh_timeout }}
          envs: >-
            IMAGE,TEST_SCRIPT,GHCR_USER,GHCR_TOKEN,DEPLOY_SECRET_VARS,
            OVERRIDE_REPO_FILE_IN_CONTAINER,OVERRIDE_HOST_FILE_PATH,OVERRIDE_CONTAINER_FILE_PATH,
            ACTOR_DATABASE_URL,DATABASE_URL,REDIS_URL,NATS_URL,
            WF_REDIS_URL,WF_NATS_URL,WQ_REDIS_URL,WQ_NATS_URL,
            ACTOR_REDIS_URL,ACTOR_NATS_URL,OTEL_EXPORTER_OTLP_ENDPOINT
          script: |
            set -euo pipefail

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"

            docker_env=()
            for v in $DEPLOY_SECRET_VARS; do docker_env+=(-e "$v"); done

            mount_args=()
            if [ "${OVERRIDE_REPO_FILE_IN_CONTAINER:-false}" = "true" ]; then
              if [ -z "${OVERRIDE_HOST_FILE_PATH:-}" ] || [ -z "${OVERRIDE_CONTAINER_FILE_PATH:-}" ]; then
                echo "Repo file override enabled but paths are missing"
                exit 1
              fi
              if [ ! -f "$OVERRIDE_HOST_FILE_PATH" ]; then
                echo "Repo file override enabled but file missing: $OVERRIDE_HOST_FILE_PATH"
                exit 1
              fi
              mount_args+=(-v "${OVERRIDE_HOST_FILE_PATH}:${OVERRIDE_CONTAINER_FILE_PATH}:ro")
              echo "Overriding ${OVERRIDE_CONTAINER_FILE_PATH} from repo (${OVERRIDE_HOST_FILE_PATH})"
            fi

            docker run --rm --network host "${mount_args[@]}" "${docker_env[@]}" "$IMAGE" sh -ec "
            $(for v in $DEPLOY_SECRET_VARS; do printf 'saved_%s=$%s\n' "$v" "$v"; done)
            set -a && . ./.env && set +a
            $(for v in $DEPLOY_SECRET_VARS; do printf 'export %s=$saved_%s\n' "$v" "$v"; done)
            exec \"$TEST_SCRIPT\"
            "
            echo "${{ matrix.suite }} complete"

  rollback-actors-migration:
    if: >-
      ${{
        always() &&
        needs.resolve-meta.outputs.run_migrate == 'true' &&
        needs.migrate-actors.result == 'success' &&
        (
          (needs.resolve-meta.outputs.run_tests == 'true' && needs.integration-tests.result == 'failure') ||
          needs.deploy.result == 'failure'
        )
      }}
    needs: [resolve-meta, migrate-actors, deploy, integration-tests]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-meta.outputs.environment }}
    env:
      ACTOR_DATABASE_URL: ${{ secrets.ACTOR_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      NATS_URL: ${{ secrets.NATS_URL }}
      WF_REDIS_URL: ${{ secrets.WF_REDIS_URL }}
      WF_NATS_URL: ${{ secrets.WF_NATS_URL }}
      WQ_REDIS_URL: ${{ secrets.WQ_REDIS_URL }}
      WQ_NATS_URL: ${{ secrets.WQ_NATS_URL }}
      ACTOR_REDIS_URL: ${{ secrets.ACTOR_REDIS_URL }}
      ACTOR_NATS_URL: ${{ secrets.ACTOR_NATS_URL }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
    steps:
      - name: Roll back actors database migrations
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ${{ needs.resolve-meta.outputs.app_image }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: >-
            IMAGE,GITHUB_RUN_ID,GHCR_USER,GHCR_TOKEN,DEPLOY_SECRET_VARS,
            ACTOR_DATABASE_URL,DATABASE_URL,REDIS_URL,NATS_URL,
            WF_REDIS_URL,WF_NATS_URL,WQ_REDIS_URL,WQ_NATS_URL,
            ACTOR_REDIS_URL,ACTOR_NATS_URL,OTEL_EXPORTER_OTLP_ENDPOINT
          script: |
            set -euo pipefail

            REVERT_MARKER="/tmp/baal-actor-migration-${GITHUB_RUN_ID}.revert-count"
            if [ ! -f "$REVERT_MARKER" ]; then
              echo "No actor migration marker at $REVERT_MARKER; nothing to roll back."
              exit 0
            fi

            revert_count="$(cat "$REVERT_MARKER")"
            if [ "${revert_count:-0}" -le 0 ]; then
              echo "No actor migrations were applied in this run; nothing to roll back."
              rm -f "$REVERT_MARKER"
              exit 0
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"

            docker_env=()
            for v in $DEPLOY_SECRET_VARS; do docker_env+=(-e "$v"); done
            docker run --rm --network host "${docker_env[@]}" "$IMAGE" sh -ec "
            $(for v in $DEPLOY_SECRET_VARS; do printf 'saved_%s=$%s\n' "$v" "$v"; done)
            set -a && . ./.env && set +a
            $(for v in $DEPLOY_SECRET_VARS; do printf 'export %s=$saved_%s\n' "$v" "$v"; done)
            i=1
            while [ \"\$i\" -le \"$revert_count\" ]; do
              echo \"==> Reverting actor migration \$i/$revert_count\"
              diesel migration revert \
                --config-file diesel-actors.toml \
                --migration-dir migrations/actors \
                --database-url \"\$ACTOR_DATABASE_URL\"
              i=\$((i + 1))
            done
            "
            rm -f "$REVERT_MARKER"
            echo "Rolled back $revert_count actor migration(s)"
