services:
  nats:
    image: nats:alpine3.22
    container_name: baal-runtime-nats
    ports:
      - "4222:4222"
      - "8222:8222"
      - "6222:6222"
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
      - "--user"
      - "runtime_nats"
      - "--pass"
      - "z2TBGYR8dF1uX2"
    volumes:
      - .dev/nats-jetstream:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # redis:
  #   image: redis:8.2.1-alpine3.22
  #   restart: always
  #   command: >
  #     redis-server
  #     --appendonly yes
  #     --appendfsync everysec
  #     --maxmemory 1gb
  #     --maxmemory-policy allkeys-lru
  #     --tcp-keepalive 60
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - ./.dev/redis_data:/data

  loadbalancer:
    image: nginx:stable-alpine3.23-perl
    container_name: baal-runtime-lb
    ports:
      - "1500:1500"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"
